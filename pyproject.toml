[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "empower-personal-dashboard"
version = "0.1.0"
description = "Python client and CLI for Empower Personal Dashboard (formerly Personal Capital) with 2FA, session persistence, holdings, and transactions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Don Petry" }
]
keywords = [
    "empower",
    "personal-capital",
    "finance",
    "net-worth",
    "investments",
    "holdings",
    "transactions",
    "banking",
    "api-client",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.2.0; python_version >= '3.10'",
]
dev = [
    "pytest>=8.0",
    "build>=1.0",
    "twine>=5.0",
]
all = [
    "empower-personal-dashboard[mcp,dev]",
]

[project.scripts]
empower = "empower_personal_dashboard.cli:main"
empower-mcp = "empower_personal_dashboard.mcp_server:main"

[project.urls]
Homepage = "https://github.com/petry-projects/empower-personal-dashboard"
Documentation = "https://github.com/petry-projects/empower-personal-dashboard#readme"
Issues = "https://github.com/petry-projects/empower-personal-dashboard/issues"
Repository = "https://github.com/petry-projects/empower-personal-dashboard.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["empower_personal_dashboard*"]
