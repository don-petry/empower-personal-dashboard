title = "gitleaks config"

# Add repo-specific allowlists below.
# Common false-positive paths:
#   BMAD knowledge/config files (docs/config, not application secrets). Scope the
#   allowlist to documentation/config extensions only — a blanket '''_bmad/'''
#   would suppress gitleaks for EVERY file under that tree (e.g. a committed
#   '''_bmad/.env''' or '''*.pem'''), letting real secrets pass the scan.
[allowlist]
description = "Allowlisted paths"
paths = [
  '''_bmad/.*\.(md|markdown|ya?ml|json|jsonc|txt|csv)$''',
]
